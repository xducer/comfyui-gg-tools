<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">GGTools — practical workflow tools for ComfyUI</title>
  <desc id="desc">Boolean Fast Muter (ggtools) connection guide. An image source connects to the target socket. A Boolean controls muting. The optional output supplies the image only while its source is enabled.</desc>
  <rect width="1200" height="440" rx="20" fill="#191b20"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="52" y="48" font-size="18" letter-spacing="2" fill="#9ba6b8">COMFYUI CUSTOM NODES</text>
    <text x="48" y="119" font-size="72" font-weight="750" fill="#f4f6fa">GGTools<tspan fill="#79d7a1">.</tspan></text>
    <text x="52" y="163" font-size="26" fill="#c0cad8">Control your workflow, one connection at a time.</text>
    <text x="52" y="212" font-size="16" letter-spacing="1.5" fill="#9ba6b8">BOOLEAN FAST MUTER · CONNECTION GUIDE</text>
    <g fill="none" stroke-width="3">
      <path d="M302 267 C378 267 389 280 465 280" stroke="#79d7a1"/>
      <path d="M302 369 C378 369 389 345 465 345" stroke="#79d7a1"/>
      <path d="M825 280 C870 280 884 280 948 280" stroke="#79d7a1"/>
    </g>
    <g id="image-source">
      <rect x="52" y="235" width="250" height="66" rx="9" fill="#2b303a"/>
      <text x="71" y="275" font-size="23" fill="#f4f6fa">Image source</text>
      <circle cx="302" cy="267" r="6" fill="#79d7a1"/>
    </g>
    <g id="boolean-source">
      <rect x="52" y="330" width="250" height="78" rx="9" fill="#2b303a"/>
      <text x="71" y="358" font-size="21" fill="#f4f6fa">Boolean</text>
      <text x="71" y="389" font-size="19" fill="#79d7a1">value: false</text>
      <circle cx="302" cy="369" r="6" fill="#79d7a1"/>
    </g>
    <g id="muter">
      <rect x="465" y="235" width="360" height="148" rx="9" fill="#2b303a"/>
      <text x="485" y="267" font-size="20" font-weight="600" fill="#f4f6fa">Boolean Fast Muter (ggtools)</text>
      <text x="485" y="306" font-size="20" fill="#c0cad8">target</text>
      <text x="485" y="355" font-size="20" fill="#c0cad8">boolean</text>
      <rect x="683" y="334" width="80" height="23" rx="12" fill="#46505c"/>
      <circle cx="695" cy="345" r="9" fill="#c0cad8"/>
      <circle cx="465" cy="280" r="6" fill="#79d7a1"/>
      <circle cx="465" cy="345" r="6" fill="#79d7a1"/>
      <circle cx="825" cy="280" r="6" fill="#79d7a1"/>
    </g>
    <g id="destination">
      <rect x="948" y="235" width="200" height="96" rx="9" fill="#2b303a"/>
      <text x="969" y="274" font-size="22" fill="#f4f6fa">Optional image</text>
      <text x="969" y="303" font-size="20" fill="#c0cad8">input</text>
      <circle cx="948" cy="280" r="6" fill="#79d7a1"/>
    </g>
    <text x="948" y="374" font-size="19" fill="#9ba6b8">true → no image</text>
  </g>
</svg>
