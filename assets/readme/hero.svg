<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">GGTools — expose the toggle, keep the routing inside</title>
  <desc id="desc">Two schematic views of the same ComfyUI subgraph. The parent node exposes a Bypass image toggle. Inside, the image input passes through Boolean Fast Muter (ggtools) to an optional input. False passes the image; true omits it for that instance, leaving other uses of the source image connected.</desc>
  <rect width="1200" height="660" rx="20" fill="#191b20"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g id="identity">
      <text x="52" y="48" font-size="18" letter-spacing="2" fill="#9ba6b8">COMFYUI CUSTOM NODES</text>
      <text x="48" y="121" font-size="76" font-weight="750" fill="#f4f6fa">GGTools<tspan fill="#79d7a1">.</tspan></text>
      <text x="52" y="166" font-size="28" fill="#c0cad8">Expose the toggle. Keep the routing inside.</text>
    </g>

    <g id="parent-view">
      <rect x="48" y="211" width="452" height="310" rx="12" fill="#20242c"/>
      <text x="72" y="249" font-size="18" letter-spacing="1.4" fill="#9ba6b8">PARENT VIEW</text>
      <path d="M238 320 C251 320 253 345 270 345" fill="none" stroke="#74baf5" stroke-width="3"/>
      <g id="source">
        <rect x="72" y="285" width="166" height="70" rx="8" fill="#2b303a"/>
        <text x="88" y="327" font-size="20" fill="#f4f6fa">Image source</text>
        <circle cx="238" cy="320" r="6" fill="#74baf5"/>
      </g>
      <g id="parent-node">
        <rect x="270" y="285" width="204" height="173" rx="8" fill="#2b303a"/>
        <text x="289" y="318" font-size="22" font-weight="600" fill="#f4f6fa">Your subgraph</text>
        <circle cx="270" cy="345" r="6" fill="#74baf5"/>
        <text x="289" y="352" font-size="20" fill="#c0cad8">image</text>
        <rect x="283" y="378" width="178" height="58" rx="8" fill="#363d48"/>
        <text x="295" y="404" font-size="18" fill="#f4f6fa">Bypass image</text>
        <text x="295" y="426" font-size="17" fill="#9ba6b8">false</text>
        <rect x="409" y="413" width="42" height="22" rx="11" fill="#525e6b"/>
        <circle cx="420" cy="424" r="8" fill="#c0cad8"/>
      </g>
      <text x="72" y="494" font-size="20" fill="#c0cad8">Control it from the main canvas.</text>
    </g>

    <g id="inside-view">
      <rect x="524" y="211" width="628" height="310" rx="12" fill="#20242c"/>
      <text x="548" y="249" font-size="18" letter-spacing="1.4" fill="#9ba6b8">INSIDE THE SAME SUBGRAPH</text>
      <g id="input-boundary" fill="none" stroke="#9ba6b8" stroke-width="2">
        <path d="M550 309 Q560 309 560 319 L560 435 Q560 445 550 445"/>
      </g>
      <text x="574" y="317" font-size="16" fill="#74baf5">image</text>
      <text x="574" y="394" font-size="16" fill="#79d7a1">boolean</text>
      <g id="inner-wiring" fill="none" stroke-width="3">
        <path d="M560 340 C595 340 607 355 648 355" stroke="#74baf5"/>
        <path d="M560 414 C595 414 607 416 648 416" stroke="#79d7a1"/>
        <path d="M926 355 C950 355 950 355 974 355" stroke="#74baf5"/>
      </g>
      <g id="muter-node">
        <rect x="648" y="285" width="278" height="173" rx="8" fill="#2b303a"/>
        <text x="666" y="315" font-size="22" font-weight="600" fill="#f4f6fa">Boolean Fast Muter</text>
        <text x="666" y="337" font-size="18" fill="#9ba6b8">(ggtools)</text>
        <text x="666" y="377" font-size="20" fill="#c0cad8">target</text>
        <text x="666" y="423" font-size="20" fill="#c0cad8">boolean</text>
        <circle cx="648" cy="355" r="6" fill="#74baf5"/>
        <circle cx="648" cy="416" r="6" fill="#79d7a1"/>
        <circle cx="926" cy="355" r="6" fill="#74baf5"/>
      </g>
      <g id="optional-destination">
        <rect x="974" y="321" width="154" height="88" rx="8" fill="#2b303a"/>
        <text x="992" y="355" font-size="21" fill="#f4f6fa">Optional</text>
        <text x="992" y="383" font-size="21" fill="#f4f6fa">image input</text>
        <circle cx="974" cy="355" r="6" fill="#74baf5"/>
      </g>
      <circle cx="560" cy="340" r="6" fill="#74baf5"/>
      <circle cx="560" cy="414" r="6" fill="#79d7a1"/>
      <text x="548" y="494" font-size="20" fill="#c0cad8">Keep the muter with the workflow it controls.</text>
    </g>

    <g id="toggle-behavior">
      <circle cx="76" cy="574" r="6" fill="#74baf5"/>
      <text x="97" y="582" font-size="26" fill="#f4f6fa"><tspan font-weight="650">false</tspan><tspan dx="8" fill="#c0cad8">→ image passes through</tspan></text>
      <circle cx="654" cy="574" r="6" fill="none" stroke="#9ba6b8" stroke-width="2"/>
      <text x="675" y="582" font-size="26" fill="#f4f6fa"><tspan font-weight="650">true</tspan><tspan dx="8" fill="#c0cad8">→ image is bypassed</tspan></text>
      <text x="72" y="629" font-size="21" fill="#9ba6b8">Only this subgraph’s input changes. Other uses of the source image stay connected.</text>
    </g>
  </g>
</svg>
